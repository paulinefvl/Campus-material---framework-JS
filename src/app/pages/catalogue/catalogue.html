<div class="page-heading">
  <h2>Catalogue</h2>
  <p>Consultez et réservez le matériel disponible sur le campus.</p>
</div>

<div class="catalogue-toolbar">
  <div class="field">
    <label for="recherche">Rechercher par nom</label>
    <input id="recherche" type="search" [formControl]="recherche">
  </div>

  <div class="field">
    <label for="categorie">Catégorie</label>
    <select id="categorie" [formControl]="categorie">
      <option value="">Toutes les catégories</option>
      @for (c of categories; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>
</div>

@if (data.equipements().length === 0) {
  <p class="empty-state">Le catalogue est vide.</p>
} @else {
  <ul>
    @for (equipement of equipementsVisibles(); track equipement.id) {
      <li>
        <app-equipement-card [equipement]="equipement" [disponible]="data.estDisponible(equipement.id)" />
      </li>
    } @empty {
      <li class="empty-state">Aucun équipement ne correspond à votre recherche.</li>
    }
  </ul>
}
