<article>
  <!-- Les input() reçus du parent servent à remplir la carte. -->
  <div class="card-topline">
    <span class="category-chip">{{ equipement().categorie }}</span>
  </div>
  <h3><a [routerLink]="['/materiels', equipement().id]">{{ equipement().nom }}</a></h3>
  <p class="location">{{ equipement().localisation }}</p>
  <p class="status-pill" [class.reserve]="!disponible()">{{ disponible() ? 'Disponible' : 'Réservé' }}</p>
</article>
