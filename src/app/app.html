<header>
  <!-- En-tête avec le menu et le compte connecté. -->
  <div class="app-shell header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">CM</span>
      <span>Campus Matériel</span>
    </div>

    @if (auth.compte(); as compte) {
      <nav aria-label="Menu principal">
        <a routerLink="/catalogue" routerLinkActive="active" ariaCurrentWhenActive="page">Catalogue</a>
        @if (auth.estEtudiant()) {
          <a routerLink="/mes-reservations" routerLinkActive="active" ariaCurrentWhenActive="page">Mes réservations</a>
        }
        @if (auth.estResponsable()) {
          <a routerLink="/gestion" routerLinkActive="active" ariaCurrentWhenActive="page">Gestion</a>
        }
      </nav>
      <div class="account-area">
        <div class="user-chip">
          <span class="user-avatar" aria-hidden="true">U</span>
          <span class="user-copy">
            <strong>{{ compte.nom }}</strong>
            <small>{{ compte.role }}</small>
          </span>
        </div>
        <button class="btn btn-secondary" type="button" (click)="deconnecter()">Se déconnecter</button>
      </div>
    }
  </div>
</header>

@if (data.erreurStockage(); as erreur) {
  <!-- On affiche l'erreur de stockage sans bloquer la page. -->
  <p role="alert">{{ erreur }}</p>
}

<main>
  <!-- La page liée à l'URL s'affiche ici. -->
  <router-outlet />
</main>
